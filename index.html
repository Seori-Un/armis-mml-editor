<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Armis MML 편집기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app">

<header class="toolbar">

  <div class="bar file">

    <button
      class="ico wide"
      data-icon="midi-open"
      title="midi 파일 선택"
    >
      <span>▤</span>
      <span class="lbl">midi 파일 선택</span>
    </button>

    <input
      id="midiInput"
      type="file"
      accept=".mid,.midi"
      hidden
    >

    <span
      class="file-status"
      id="fileStatus"
    >
      불러온 파일이 없습니다
    </span>

  </div>


  <div class="bar edit">

    <div class="group">

      <button
        class="ico"
        data-icon="undo"
        title="실행취소"
      >
        되돌<br>리기
      </button>

      <button
        class="ico"
        data-icon="redo"
        title="다시하기"
      >
        다시<br>하기
      </button>

    </div>

    <span class="divider"></span>

    <div class="group">

      <button
        class="ico"
        data-icon="technique"
        title="현재 악기의 기법 선택"
      >
        기법
      </button>

    </div>

    <span class="divider"></span>

    <div class="group">

      <button
        class="ico"
        data-icon="note-add"
        title="노트 추가 — 가운데에 뜬 뒤 끌어다 놓습니다"
      >
        +
      </button>

      <button
        class="ico"
        data-icon="note-delete"
        title="선택한 노트 또는 마커 또는 트랙 삭제"
      >
        삭제
      </button>

    </div>

    <span class="divider"></span>

    <div class="group">

      <button
        class="ico"
        id="selectMode"
        data-icon="select"
        title="여러 개 고르기 — 노트를 눌러 담거나 빼고, 빈 곳을 끌어 감쌉니다 (Ctrl+클릭과 같음)"
      >
        선택
      </button>

      <button
        class="ico"
        id="copyNotes"
        data-icon="note-copy"
        title="고른 노트 복사"
      >
        복사
      </button>

      <button
        class="ico"
        id="pasteNotes"
        data-icon="note-paste"
        title="붙여넣기 — 가운데에 뜬 뒤 끌어다 놓습니다"
      >
        붙여<br>넣기
      </button>

    </div>

    <span class="divider"></span>

    <div class="group">

      <button
        class="ico lg"
        data-icon="play"
        title="재생"
      >
        ▶
      </button>

      <button
        class="ico lg"
        data-icon="stop"
        title="정지"
      >
        ■
      </button>

    </div>

    <span class="spacer"></span>

    <div class="group">

      <button
        class="ico"
        id="zoomOut"
        data-icon="zoom-out"
        title="축소"
      >
        축소
      </button>

      <span
        class="zoom-read"
        id="zoomRead"
        title="클릭하면 100%로"
      >
        100%
      </span>

      <button
        class="ico"
        id="zoomIn"
        data-icon="zoom-in"
        title="확대"
      >
        확대
      </button>

    </div>

  </div>

</header>


<section class="stage">

<aside class="rail">

  <div class="rail-title">
    tracks
  </div>

  <button
    class="track-add"
    data-icon="track-add"
    title="트랙 추가"
  >
    <span>+</span>
    <span>트랙 추가</span>
  </button>

</aside>


<div class="oct-label">
  <span>octave</span>
</div>


<div class="center">

  <div class="center-head">

    <span
      class="tempo-read"
      id="centerTempo"
      title="클릭하여 템포 직접 입력"
    >
      ♩ = 120 · 4/4
    </span>

    <input
      class="tempo-editor"
      id="tempoEditor"
      type="number"
      min="20"
      max="400"
      step="1"
      value="120"
      aria-label="템포 직접 입력"
    >

    <h2>
      time table
    </h2>

  </div>


  <div class="board">

    <div class="board-inner">

      <div
        class="ruler"
        id="ruler"
      ></div>


      <div
        class="grid"
        id="grid"
      >

        <div class="oct-sticky">

          <div
            class="oct-scale"
            id="octScale"
          ></div>

        </div>


        <div
          class="playhead"
          id="playhead"
          style="left:312px"
        ></div>

      </div>

    </div>

  </div>

</div>


<aside class="inspector">

  <div>

    <div class="sect-title">
      note length
    </div>

    <div
      class="row"
      id="lengthControls"
    >

      <button
        class="len-btn"
        data-length="1"
      >
        1
      </button>

      <button
        class="len-btn"
        data-length="2"
      >
        2
      </button>

      <button
        class="len-btn on"
        data-length="4"
      >
        4
      </button>

      <button
        class="len-btn"
        data-length="8"
      >
        8
      </button>

      <button
        class="len-btn"
        data-length="16"
      >
        16
      </button>

      <span class="len-sep">셋잇단</span>

      <button
        class="len-btn"
        data-length="3"
        title="2분음표 셋잇단"
      >
        3
      </button>

      <button
        class="len-btn"
        data-length="6"
        title="4분음표 셋잇단"
      >
        6
      </button>

      <button
        class="len-btn"
        data-length="12"
        title="8분음표 셋잇단"
      >
        12
      </button>

      <button
        class="len-btn"
        data-length="24"
        title="16분음표 셋잇단"
      >
        24
      </button>

      <button
        class="len-btn"
        data-length="48"
        title="32분음표 셋잇단"
      >
        48
      </button>

      <span class="len-sep">점 · 이음줄</span>

      <button
        class="len-btn"
        data-length="dot"
        title="점음표 — 길이를 1.5배로. 셋잇단에도 붙는다"
      >
        ·
      </button>

      <button
        class="len-btn"
        data-length="tie"
        title="이음줄 — 뒤 음과 이어 한 소리로. 이어질 음이 없으면 새로 만든다"
      >
        &amp;
      </button>

    </div>

  </div>


  <div>

    <div class="vel-head">

      <span
        class="sect-title"
        style="margin:0"
      >
        velocity
      </span>

      <span
        class="vel-val"
        id="velocityValue"
      >
        12
      </span>

    </div>


    <input
      type="range"
      min="0"
      max="15"
      step="1"
      value="12"
      aria-label="벨로시티"
      id="velocityRange"
    >


    <div class="vel-scale">

      <span>0</span>
      <span>15</span>

    </div>

  </div>


  <div>

    <div class="sect-title">
      tempo
    </div>

    <div class="tempo-control">

      <button
        class="tempo-arrow"
        id="tempoDown"
        title="템포 내리기"
      >
        ▼
      </button>

      <span
        class="tempo-number"
        id="tempoNumber"
        title="클릭하여 직접 입력"
      >
        120
      </span>

      <button
        class="tempo-arrow"
        id="tempoUp"
        title="템포 올리기"
      >
        ▲
      </button>

    </div>

  </div>


  <div>

    <div class="sect-title">
      technique
    </div>

    <div
      class="row"
      id="inspectorTechniques"
    ></div>

  </div>

</aside>

</section>


<div
  class="output-resize"
  id="outputResize"
  title="끌어서 출력 창 높이 조절"
></div>


<footer
  class="foot"
  id="output"
></footer>


<div
  class="tech-menu"
  id="techMenu"
  role="menu"
>
  <div class="tech-menu-title">
    technique
  </div>

  <div id="techMenuList"></div>
</div>


<div
  class="instrument-menu"
  id="instrumentMenu"
>

  <div class="instrument-menu-title">
    instrument
  </div>

  <div
    class="instrument-menu-list"
    id="instrumentMenuList"
  ></div>

</div>


<div
  class="marker-menu"
  id="markerMenu"
>

  <div class="marker-menu-title">
    같은 자리의 마커
  </div>

  <div id="markerMenuList"></div>

</div>


<div
  class="dialog-backdrop"
  id="dialogBackdrop"
>

  <div
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialogTitle"
  >

    <div class="dialog-body">

      <div
        class="dialog-eyebrow"
        id="dialogEyebrow"
      >
        confirm
      </div>

      <h3
        class="dialog-title"
        id="dialogTitle"
      ></h3>

      <p
        class="dialog-text"
        id="dialogText"
      ></p>

      <div class="dialog-actions">

        <button
          class="dialog-btn"
          id="dialogCancel"
          type="button"
        >
          취소
        </button>

        <button
          class="dialog-btn primary"
          id="dialogOk"
          type="button"
        >
          확인
        </button>

      </div>

    </div>

  </div>

</div>


<div
  class="toast-area"
  id="toastArea"
></div>



<script src="midi-engine.js"></script>
<script src="app.js"></script>

</body>
</html>
