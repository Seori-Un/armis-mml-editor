<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Armis MML 편집기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app">

<header class="toolbar">

  <div class="bar file">

    <button
      class="ico wide"
      data-icon="midi-open"
      data-i18n-title="toolbar.openMidi"
      title="midi 파일 선택"
    >
      <span>▤</span>
      <span
        class="lbl"
        data-i18n="toolbar.openMidi"
      >
        midi 파일 선택
      </span>
    </button>

    <input
      id="midiInput"
      type="file"
      accept=".mid,.midi"
      hidden
    >

    <span
      class="file-status"
      id="fileStatus"
      data-i18n="toolbar.noFile"
    >
      불러온 파일이 없습니다
    </span>

    <span class="spacer"></span>

    <!-- 작업 저장 / 불러오기 (미디가 아니라 편집 중인 곡 그대로) -->
    <button
      class="ico wide"
      id="saveProject"
      type="button"
      data-i18n-title="toolbar.saveFileTip"
      title="지금 작업을 파일로 내려받습니다"
    >
      <span>▼</span>
      <span
        class="lbl"
        data-i18n="toolbar.saveFile"
      >저장</span>
    </button>

    <button
      class="ico wide"
      id="openProject"
      type="button"
      data-i18n-title="toolbar.openFileTip"
      title="저장해 둔 작업 파일을 불러옵니다"
    >
      <span>▲</span>
      <span
        class="lbl"
        data-i18n="toolbar.openFile"
      >열기</span>
    </button>

    <input
      id="projectInput"
      type="file"
      accept=".json,.armml"
      hidden
    >

    <!-- 오른쪽 위. 누르면 말 고르는 창이 뜬다. -->
    <button
      class="lang-button"
      id="langButton"
      type="button"
      data-i18n-title="toolbar.language"
      title="언어"
    >
      <span class="lang-button-mark">🌐</span>
      <span
        class="lang-button-name"
        id="langButtonName"
      >한국어</span>
    </button>

  </div>


  <div class="bar edit">

    <div class="group">

      <button
        class="ico"
        data-icon="undo"
        data-i18n-html="toolbar.undo"
        data-i18n-title="toolbar.undoTip"
        title="실행취소"
      >
        되돌<br>리기
      </button>

      <button
        class="ico"
        data-icon="redo"
        data-i18n-html="toolbar.redo"
        data-i18n-title="toolbar.redoTip"
        title="다시하기"
      >
        다시<br>하기
      </button>

    </div>

    <span class="divider"></span>

    <div class="group">

      <button
        class="ico"
        data-icon="technique"
        data-i18n="toolbar.technique"
        data-i18n-title="toolbar.techniqueTip"
        title="현재 악기의 기법 선택"
      >
        기법
      </button>

    </div>

    <span class="divider"></span>

    <div class="group">

      <button
        class="ico"
        data-icon="note-add"
        data-i18n-title="toolbar.noteAddTip"
        title="노트 추가 — 가운데에 뜬 뒤 끌어다 놓습니다"
      >
        +
      </button>

      <button
        class="ico"
        data-icon="note-delete"
        data-i18n="toolbar.noteDelete"
        data-i18n-title="toolbar.noteDeleteTip"
        title="선택한 노트 또는 마커 또는 트랙 삭제"
      >
        삭제
      </button>

    </div>

    <span class="divider"></span>

    <div class="group">

      <button
        class="ico"
        id="selectMode"
        data-icon="select"
        data-i18n="toolbar.select"
        data-i18n-title="toolbar.selectTip"
        title="여러 개 고르기 — 노트를 눌러 담거나 빼고, 빈 곳을 끌어 감쌉니다 (Ctrl+클릭과 같음)"
      >
        선택
      </button>

      <button
        class="ico"
        id="copyNotes"
        data-icon="note-copy"
        data-i18n="toolbar.copy"
        data-i18n-title="toolbar.copyTip"
        title="고른 노트 복사"
      >
        복사
      </button>

      <button
        class="ico"
        id="pasteNotes"
        data-icon="note-paste"
        data-i18n-html="toolbar.paste"
        data-i18n-title="toolbar.pasteTip"
        title="붙여넣기 — 가운데에 뜬 뒤 끌어다 놓습니다"
      >
        붙여<br>넣기
      </button>

    </div>

    <span class="divider"></span>

    <div class="group">

      <button
        class="ico lg"
        data-icon="play"
        data-i18n-title="toolbar.playTip"
        title="재생"
      >
        ▶
      </button>

      <button
        class="ico lg"
        data-icon="stop"
        data-i18n-title="toolbar.stopTip"
        title="정지"
      >
        ■
      </button>

    </div>

    <span class="spacer"></span>

    <div class="group">

      <button
        class="ico"
        id="zoomOut"
        data-icon="zoom-out"
        data-i18n="toolbar.zoomOut"
        data-i18n-title="toolbar.zoomOut"
        title="축소"
      >
        축소
      </button>

      <span
        class="zoom-read"
        id="zoomRead"
        data-i18n-title="toolbar.zoomReset"
        title="클릭하면 100%로"
      >
        100%
      </span>

      <button
        class="ico"
        id="zoomIn"
        data-icon="zoom-in"
        data-i18n="toolbar.zoomIn"
        data-i18n-title="toolbar.zoomIn"
        title="확대"
      >
        확대
      </button>

    </div>

    <span class="divider narrow-only"></span>

    <div class="group narrow-only">

      <!-- 좁은 화면에서는 오른쪽 패널이 접힌다. 이 버튼으로 연다. -->
      <button
        class="ico"
        id="inspectorToggle"
        type="button"
        data-i18n="toolbar.panel"
        data-i18n-title="toolbar.panelTip"
        title="세기 · 기법 · 템포 패널 열기"
      >
        패널
      </button>

    </div>


  </div>

</header>


<section class="stage">

<aside class="rail">

  <div
    class="rail-title"
    data-i18n="rail.title"
  >
    tracks
  </div>

  <button
    class="track-add"
    data-icon="track-add"
    data-i18n-title="rail.addTrack"
    title="트랙 추가"
  >
    <span>+</span>
    <span data-i18n="rail.addTrack">트랙 추가</span>
  </button>

</aside>


<div class="center">

  <div class="center-head">

    <span
      class="tempo-read"
      id="centerTempo"
      data-i18n-title="board.tempoTip"
      title="클릭하여 템포 직접 입력"
    >
      ♩ = 120 · 4/4
    </span>

    <input
      class="tempo-editor"
      id="tempoEditor"
      type="number"
      min="20"
      max="400"
      step="1"
      value="120"
      data-i18n-aria="board.tempoInput"
      aria-label="템포 직접 입력"
    >

  </div>


  <div class="board">

    <div class="board-inner">

      <div
        class="ruler"
        id="ruler"
      ></div>


      <div
        class="grid"
        id="grid"
      >

        <div class="oct-sticky">

          <div
            class="oct-scale"
            id="octScale"
          ></div>

        </div>


        <div
          class="playhead"
          id="playhead"
          style="left:312px"
        ></div>

      </div>

    </div>

  </div>

</div>


<aside class="inspector" id="inspector">

  <!-- 좁은 화면에서 아래에서 올라왔을 때만 보이는 닫기 줄 -->
  <div class="inspector-head narrow-only">

    <span data-i18n="inspector.title">패널</span>

    <button
      class="inspector-close"
      id="inspectorClose"
      type="button"
      data-i18n-aria="common.close"
      aria-label="닫기"
    >×</button>

  </div>

  <div>

    <div
      class="sect-title"
      data-i18n="inspector.noteLength"
    >
      note length
    </div>

    <div
      class="row"
      id="lengthControls"
    >

      <button
        class="len-btn"
        data-length="1"
      >
        1
      </button>

      <button
        class="len-btn"
        data-length="2"
      >
        2
      </button>

      <button
        class="len-btn on"
        data-length="4"
      >
        4
      </button>

      <button
        class="len-btn"
        data-length="8"
      >
        8
      </button>

      <button
        class="len-btn"
        data-length="16"
      >
        16
      </button>

      <span
        class="len-sep"
        data-i18n="inspector.triplet"
      >셋잇단</span>

      <button
        class="len-btn"
        data-length="3"
        data-i18n-title="inspector.tripletHalf"
        title="2분음표 셋잇단"
      >
        3
      </button>

      <button
        class="len-btn"
        data-length="6"
        data-i18n-title="inspector.tripletQuarter"
        title="4분음표 셋잇단"
      >
        6
      </button>

      <button
        class="len-btn"
        data-length="12"
        data-i18n-title="inspector.tripletEighth"
        title="8분음표 셋잇단"
      >
        12
      </button>

      <button
        class="len-btn"
        data-length="24"
        data-i18n-title="inspector.tripletSixteenth"
        title="16분음표 셋잇단"
      >
        24
      </button>

      <button
        class="len-btn"
        data-length="48"
        data-i18n-title="inspector.tripletThirtySecond"
        title="32분음표 셋잇단"
      >
        48
      </button>

      <span
        class="len-sep"
        data-i18n="inspector.dotTie"
      >점 · 이음줄</span>

      <button
        class="len-btn"
        data-length="dot"
        data-i18n-title="inspector.dotTip"
        title="점음표 — 길이를 1.5배로. 셋잇단에도 붙는다"
      >
        ·
      </button>

      <button
        class="len-btn"
        data-length="tie"
        data-i18n-title="inspector.tieTip"
        title="이음줄 — 뒤 음과 이어 한 소리로. 이어질 음이 없으면 새로 만든다"
      >
        &amp;
      </button>

    </div>

  </div>


  <div>

    <div class="vel-head">

      <span
        class="sect-title"
        style="margin:0"
        data-i18n="inspector.velocity"
      >
        velocity
      </span>

      <span
        class="vel-val"
        id="velocityValue"
      >
        12
      </span>

    </div>


    <input
      type="range"
      min="0"
      max="15"
      step="1"
      value="12"
      data-i18n-aria="inspector.velocityAria"
      aria-label="벨로시티"
      id="velocityRange"
    >


    <div class="vel-scale">

      <span>0</span>
      <span>15</span>

    </div>

  </div>


  <div>

    <div
      class="sect-title"
      data-i18n="inspector.tempo"
    >
      tempo
    </div>

    <div class="tempo-control">

      <button
        class="tempo-arrow"
        id="tempoDown"
        data-i18n-title="inspector.tempoDown"
        title="템포 내리기"
      >
        ▼
      </button>

      <span
        class="tempo-number"
        id="tempoNumber"
        data-i18n-title="inspector.tempoDirect"
        title="클릭하여 직접 입력"
      >
        120
      </span>

      <button
        class="tempo-arrow"
        id="tempoUp"
        data-i18n-title="inspector.tempoUp"
        title="템포 올리기"
      >
        ▲
      </button>

    </div>

  </div>


  <div>

    <div
      class="sect-title"
      data-i18n="inspector.technique"
    >
      technique
    </div>

    <div
      class="row"
      id="inspectorTechniques"
    ></div>

  </div>

</aside>

</section>


<div
  class="output-resize"
  id="outputResize"
  data-i18n-title="outputResize.tip"
  title="끌어서 출력 창 높이 조절"
></div>


<footer
  class="foot"
  id="output"
></footer>


<div
  class="tech-menu"
  id="techMenu"
  role="menu"
>
  <div
    class="tech-menu-title"
    data-i18n="menu.technique"
  >
    technique
  </div>

  <div id="techMenuList"></div>
</div>


<div
  class="instrument-menu"
  id="instrumentMenu"
>

  <div
    class="instrument-menu-title"
    data-i18n="menu.instrument"
  >
    instrument
  </div>

  <div
    class="instrument-menu-list"
    id="instrumentMenuList"
  ></div>

</div>


<div
  class="marker-menu"
  id="markerMenu"
>

  <div
    class="marker-menu-title"
    data-i18n="menu.markerStack"
  >
    같은 자리의 마커
  </div>

  <div id="markerMenuList"></div>

</div>


<div
  class="dialog-backdrop"
  id="dialogBackdrop"
>

  <div
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialogTitle"
  >

    <div class="dialog-body">

      <div
        class="dialog-eyebrow"
        id="dialogEyebrow"
      >
        confirm
      </div>

      <h3
        class="dialog-title"
        id="dialogTitle"
      ></h3>

      <p
        class="dialog-text"
        id="dialogText"
      ></p>

      <div class="dialog-actions">

        <button
          class="dialog-btn"
          id="dialogCancel"
          type="button"
          data-i18n="common.cancel"
        >
          취소
        </button>

        <button
          class="dialog-btn primary"
          id="dialogOk"
          type="button"
          data-i18n="common.ok"
        >
          확인
        </button>

      </div>

    </div>

  </div>

</div>


<!-- 말 고르는 창.
     브라우저 기본 창(alert/select)은 쓰지 않는다 — 화면과 따로 놀아
     보기 싫고, 색도 못 맞춘다. 확인창과 같은 모양으로 만든다. -->
<div
  class="dialog-backdrop"
  id="langBackdrop"
>

  <div
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="langDialogTitle"
  >

    <div class="dialog-body">

      <div class="dialog-eyebrow">
        language
      </div>

      <h3
        class="dialog-title"
        id="langDialogTitle"
        data-i18n="toolbar.language"
      >
        언어
      </h3>

      <div
        class="lang-list"
        id="langList"
      ></div>

      <div class="dialog-actions">

        <button
          class="dialog-btn"
          id="langClose"
          type="button"
          data-i18n="common.cancel"
        >
          취소
        </button>

      </div>

    </div>

  </div>

</div>


<div
  class="toast-area"
  id="toastArea"
></div>



<script src="i18n.js"></script>
<script src="midi-engine.js"></script>
<script src="app.js"></script>

</body>
</html>
