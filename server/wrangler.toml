name = "armis-mml-convert"
main = "worker.js"
compatibility_date = "2025-01-01"

# ------------------------------------------------------------
# CPU 시간 한도
# ------------------------------------------------------------
# 무료 플랜: 요청당 CPU 10ms. 합주 변환(파트 그대로)은 대개 안에 들지만,
# 솔로 분배(세 트랙 글자 수 맞추기)는 1~2초가 들어 반드시 실패한다.
# 그때 화면은 자동으로 브라우저 계산으로 넘어가지만, 사양 낮은 폰에선
# 그게 버겁다.
#
# 유료 플랜(Workers Paid, 월 $5)으로 올리면 요청당 CPU 30초가 기본이고
# 아래처럼 늘릴 수도 있다. 이 줄은 무료 플랜에서는 무시된다.
[limits]
cpu_ms = 30000

# ------------------------------------------------------------
# 공동 작업 방 (Durable Object)
# ------------------------------------------------------------
# 방 하나 = CollabRoom 인스턴스 하나. worker.js 아래쪽에 클래스가 있다.
# SQLite 저장 방식이라 무료 플랜에서도 동작한다 (2025년 4월부터).
# 무료 한도: 요청 10만 건/일, 저장 5GB — 곡 몇 개 수준에서는 넉넉하다.
[durable_objects]
bindings = [
  { name = "COLLAB_ROOM", class_name = "CollabRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CollabRoom"]
